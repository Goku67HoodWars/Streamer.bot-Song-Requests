<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Song request queue dock - add in OBS via  View -> Docks -> Custom Browser Docks…
  (URL = this file's path, or http://127.0.0.1:8090/dock while the queue is running).
  Shows the combined Spotify + YouTube queue; lets you skip the current song, remove
  queued YouTube requests, adjust YouTube volume, and add a request yourself.
-->
<style>
  :root{--bg:#131318;--card:#1e1e26;--card2:#25252f;--txt:#e8e8f0;--dim:#8c8c9c;
        --green:#1db954;--green2:#1ed760;--red:#f05a5a;--yt:#ff5252;--sp:#1ed760}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  #app{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 20px)}

  .card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px}
  /* collapsible sections */
  .sh{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:8px}
  .sh .chev{color:var(--txt);font-size:16px;line-height:1;transition:transform .15s,background .12s;flex:none;
    opacity:.85;padding:1px 6px;border-radius:6px}
  .sh:hover .chev{opacity:1;background:rgba(255,255,255,.1)}
  .card.collapsed .chev{transform:rotate(-90deg)}
  .card.collapsed .body{display:none}
  .card.collapsed{padding-bottom:10px}
  .card.collapsed.grow{flex:0 0 auto!important}
  .sh .htitle{font-size:12.5px;font-weight:700;letter-spacing:.3px}
  .muted{color:var(--dim)}
  .badge{font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:99px;flex:none}
  .badge.yt{background:rgba(255,82,82,.15);color:var(--yt)}
  .badge.sp{background:rgba(30,215,96,.14);color:var(--sp)}

  /* now playing */
  #now{display:flex;gap:10px;align-items:center}
  #art{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#2a2a34;flex:none}
  #nowInfo{flex:1;min-width:0}
  #nowTitle{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #nowArtist{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  #seek{padding:7px 0;margin-top:3px;cursor:pointer;touch-action:none}
  #barbg{height:5px;background:rgba(255,255,255,.13);border-radius:99px;position:relative}
  #bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:99px}
  #knob{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.5);opacity:0;transition:opacity .12s}
  #seek:hover #knob,#seek.drag #knob{opacity:1}
  #pp,#skip{flex:none;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--txt);
    border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;line-height:1}
  #pp{padding:9px 11px}
  #skip{padding:9px 14px}
  #pp:hover,#skip:hover{background:#33333f}
  .reqtag{color:var(--green2)}
  .autotag{color:#6a6a78;font-style:italic}

  /* queue */
  #qHead{display:flex;align-items:center;gap:8px;margin:2px 2px 6px}
  #qHead b{font-size:12.5px;letter-spacing:.3px}
  #qCount{color:var(--dim);font-size:11px}
  .row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px}
  .row:hover{background:rgba(255,255,255,.04)}
  .row .t{flex:1;min-width:0}
  .row .title{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sub{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dur{color:var(--dim);font-size:11px;flex:none}
  .row .x{flex:none;width:22px;height:22px;border-radius:6px;border:none;cursor:pointer;
    background:rgba(240,90,90,.12);color:var(--red);font-weight:700;font-size:12px;line-height:1}
  .row .x:hover{background:rgba(240,90,90,.28)}
  #empty{color:var(--dim);text-align:center;padding:14px 0 10px;font-size:12px}

  /* footer controls */
  #cardRow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  #cardRow label{color:var(--dim);font-size:11px;flex:1}
  #cardState{color:var(--dim);font-size:11px;width:22px;text-align:right}
  .setRow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .setRow>label{color:var(--dim);font-size:11px;flex:1}
  .setRow .st{color:var(--dim);font-size:11px;width:22px;text-align:right}
  #powerBtns{display:flex;gap:8px}
  .card.drag-over{outline:2px dashed var(--green);outline-offset:-2px}
  .card.dragging{opacity:.45}
  .pbtn{flex:1;background:var(--card2);border:1px solid rgba(255,255,255,.1);color:var(--txt);
    border-radius:8px;padding:9px;font-weight:700;font-size:12px;cursor:pointer}
  .pbtn:hover{background:#33333f}
  .pbtn.danger{color:var(--red);border-color:rgba(240,90,90,.3)}
  .pbtn.danger:hover{background:rgba(240,90,90,.15)}
  .pbtn:disabled{opacity:.6;cursor:default}
  .toggle{flex:none;width:38px;height:22px;border-radius:99px;border:none;background:#3a3a44;
    position:relative;cursor:pointer;padding:0;transition:background .15s}
  .toggle[aria-checked="true"]{background:var(--green)}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;transition:left .15s}
  .toggle[aria-checked="true"] .knob{left:18px}
  .toggle.disabled{opacity:.35;pointer-events:none}
  #volRow{display:flex;align-items:center;gap:9px}
  #volRow label{color:var(--dim);font-size:11px;flex:none}
  #vol{flex:1;accent-color:var(--green)}
  #volVal{width:30px;text-align:right;color:var(--dim);font-size:11px}
  #maxLenRow{display:flex;align-items:center;gap:9px}
  #maxLenRow label{color:var(--dim);font-size:11px;flex:1}
  #maxlen{width:52px;background:#26262e;border:1px solid #3a3a44;color:#fff;border-radius:6px;padding:3px 6px;font-size:12px;text-align:right}
  #maxLenRow .unit{color:var(--dim);font-size:11px;flex:none}
  #addRow{display:flex;gap:7px;margin-top:8px}
  #addText{flex:1;background:var(--card2);border:1px solid rgba(255,255,255,.09);color:var(--txt);
    border-radius:8px;padding:8px 10px;font-size:12.5px;outline:none}
  #addText::placeholder{color:#5a5a68}
  #addBtn{background:var(--green);border:none;color:#fff;border-radius:8px;padding:8px 14px;
    font-weight:700;font-size:12px;cursor:pointer}
  #addBtn:hover{background:var(--green2)}
  #addMsg{font-size:11px;color:var(--dim);margin-top:5px;min-height:14px}

  #offline{display:none;text-align:center;padding:26px 10px;color:var(--dim)}
  #offline b{color:var(--txt)}
  #warn{display:none;font-size:11px;color:#e8b34c;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <div id="offline" class="card"><b>Queue isn't running</b><br>Start it in Song Requests - this dock reconnects on its own.</div>

  <div id="main" style="display:none;flex-direction:column;gap:10px">
    <div class="card" data-sec="now">
      <div class="sh"><span class="htitle">Now playing</span><span class="chev">▾</span></div>
      <div class="body">
        <div id="now">
          <img id="art" alt="">
          <div id="nowInfo">
            <div style="display:flex;align-items:center;gap:8px">
              <span id="srcBadge" class="badge sp">SPOTIFY</span>
              <div id="nowTitle">Nothing playing</div>
            </div>
            <div id="nowArtist"></div>
            <div id="seek"><div id="barbg"><div id="bar"></div><div id="knob"></div></div></div>
          </div>
          <button id="pp" title="Play / pause">❚❚</button>
          <button id="skip" title="Skip the current song">Skip ▸</button>
        </div>
        <div id="warn">YouTube requests are on, but the YouTube player source isn't loaded in OBS.</div>
      </div>
    </div>

    <div class="card grow" data-sec="next" style="flex:1">
      <div class="sh"><span id="qHead"><b>Up next</b> <span id="qCount"></span></span><span class="chev">▾</span></div>
      <div class="body">
        <div id="list"></div>
        <div id="empty" style="display:none">Queue is empty</div>
      </div>
    </div>

    <div class="card" data-sec="settings">
      <div class="sh"><span class="htitle">Settings</span><span class="chev">▾</span></div>
      <div class="body">
      <div class="setRow">
        <label>Song requests</label>
        <button id="allToggle" class="toggle" role="switch" aria-checked="true" title="Master switch for all song requests"><span class="knob"></span></button>
        <span id="allState" class="st">On</span>
      </div>
      <div class="setRow">
        <label>Spotify requests</label>
        <button id="spToggle" class="toggle" role="switch" aria-checked="true" title="Accept Spotify song requests"><span class="knob"></span></button>
        <span id="spState" class="st">On</span>
      </div>
      <div class="setRow">
        <label>YouTube requests</label>
        <button id="ytToggle" class="toggle" role="switch" aria-checked="false" title="Accept YouTube song requests"><span class="knob"></span></button>
        <span id="ytState" class="st">Off</span>
      </div>
      <div class="setRow">
        <label>Announce queued songs in chat</label>
        <button id="chatToggle" class="toggle" role="switch" aria-checked="false" title="Post each request's result to Twitch chat (needs the Streamer.bot announce action set up)"><span class="knob"></span></button>
        <span id="chatState" class="st">Off</span>
      </div>
      <div id="volRow">
        <label>YouTube volume</label>
        <input id="vol" type="range" min="0" max="100" value="70">
        <span id="volVal">70</span>
      </div>
      <div id="maxLenRow">
        <label>Max song length</label>
        <input id="maxlen" type="text" inputmode="numeric" maxlength="2" value="6" title="Longest song allowed (1-10 min). Requests over this are rejected + refunded.">
        <span class="unit">min</span>
      </div>
      <div id="addRow">
        <input id="addText" placeholder="Add a song… (name, Spotify or YouTube link, yt / sp prefix)">
        <button id="addBtn">Add</button>
      </div>
      <div id="addMsg"></div>
      </div>
    </div>

    <div class="card" data-sec="power" id="powerCard">
      <div class="sh"><span class="htitle">Engine</span><span class="chev">▾</span></div>
      <div class="body"><div id="powerBtns">
        <button id="restartBtn" class="pbtn" title="Restart the engine">⟳ Restart</button>
        <button id="stopBtn" class="pbtn danger" title="Stop the engine (start again from OBS)">■ Stop</button>
      </div></div>
    </div>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:8090";
  const $ = id => document.getElementById(id);
  let TOK = "__SQTOKEN__";                       // replaced by the app when served from /dock
  let prog = 0, dur = 1, playing = false, stamp = 0, curArt = "", volDrag = false, volT = 0, adding = false, skipBusy = false, msgT = 0, maxlenBusy = false, maxlenT = 0;
  let ppBusy = false, seekDrag = false;
  let spEnabled = true, spConnected = true, ytEnabled = false, spBusy = false, ytBusy = false, stopArm = false, stopT = 0;
  let chatOn = false, chatBusy = false, allOn = true, allBusy = false;

  async function ensureTok(force){
    if (force || TOK === "__" + "SQTOKEN__"){ try { const r = await fetch(API + "/token"); if (r.ok) TOK = (await r.json()).tok; } catch(_){} }
  }
  function fmt(s){ s = Math.max(0, s|0); return (s/60|0) + ":" + String(s%60).padStart(2,"0"); }
  function cmd(q){ return fetch(API + "/cmd?tok=" + TOK + "&" + q).then(r => r.json()).catch(() => null); }

  $("skip").onclick = async () => {
    if (skipBusy) return;
    skipBusy = true; $("skip").disabled = true;
    await cmd("cmd=skip");
    setTimeout(() => { skipBusy = false; $("skip").disabled = false; }, 1000);   // no double-skip
  };
  $("pp").onclick = async () => {
    if (ppBusy) return; ppBusy = true;
    playing = !playing; $("pp").textContent = playing ? "❚❚" : "▶";   // optimistic; poll confirms
    await cmd("cmd=pause");
    setTimeout(() => ppBusy = false, 500);
  };
  const seekEl = $("seek");
  function seekRatio(e){ const r = $("barbg").getBoundingClientRect(); return r.width ? Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) : 0; }
  function paintSeek(ratio){ $("bar").style.width = (ratio * 100) + "%"; $("knob").style.left = (ratio * 100) + "%"; }
  seekEl.addEventListener("pointerdown", e => { if (dur <= 1000) return; seekDrag = true; seekEl.classList.add("drag"); try { seekEl.setPointerCapture(e.pointerId); } catch(_){} paintSeek(seekRatio(e)); });
  seekEl.addEventListener("pointermove", e => { if (seekDrag) paintSeek(seekRatio(e)); });
  seekEl.addEventListener("pointerup", e => {
    if (!seekDrag) return;
    seekDrag = false; seekEl.classList.remove("drag");
    const ms = Math.round(seekRatio(e) * dur);
    cmd("cmd=seek&ms=" + ms);
    prog = ms; stamp = performance.now();   // optimistic so the playhead doesn't snap back before the next poll
  });
  $("spToggle").onclick = async () => { if (spBusy || !spConnected) return; spBusy = true; spEnabled = !spEnabled; applySp(); await cmd("cmd=enable&src=sp&on=" + (spEnabled ? 1 : 0)); setTimeout(() => spBusy = false, 600); };
  $("ytToggle").onclick = async () => { if (ytBusy) return; ytBusy = true; ytEnabled = !ytEnabled; applyYt(); await cmd("cmd=enable&src=yt&on=" + (ytEnabled ? 1 : 0)); setTimeout(() => ytBusy = false, 600); };
  function applySp(){
    const t = $("spToggle");
    if (!spConnected){ t.classList.add("disabled"); t.setAttribute("aria-checked", "false"); $("spState").textContent = "Not connected"; return; }
    t.classList.remove("disabled"); t.setAttribute("aria-checked", spEnabled ? "true" : "false"); $("spState").textContent = spEnabled ? "On" : "Off";
  }
  function applyYt(){ $("ytToggle").setAttribute("aria-checked", ytEnabled ? "true" : "false"); $("ytState").textContent = ytEnabled ? "On" : "Off"; }
  $("chatToggle").onclick = async () => { if (chatBusy) return; chatBusy = true; chatOn = !chatOn; applyChat(); await cmd("cmd=enable&src=chat&on=" + (chatOn ? 1 : 0)); setTimeout(() => chatBusy = false, 600); };
  function applyChat(){ $("chatToggle").setAttribute("aria-checked", chatOn ? "true" : "false"); $("chatState").textContent = chatOn ? "On" : "Off"; }
  $("allToggle").onclick = async () => { if (allBusy) return; allBusy = true; allOn = !allOn; applyAll(); await cmd("cmd=enable&src=all&on=" + (allOn ? 1 : 0)); setTimeout(() => allBusy = false, 600); };
  function applyAll(){ $("allToggle").setAttribute("aria-checked", allOn ? "true" : "false"); $("allState").textContent = allOn ? "On" : "Off"; }
  $("restartBtn").onclick = async () => {
    $("restartBtn").disabled = true; $("restartBtn").textContent = "Restarting…";
    await cmd("cmd=restart");
    setTimeout(() => { $("restartBtn").disabled = false; $("restartBtn").textContent = "⟳ Restart"; }, 5000);
  };
  $("stopBtn").onclick = async () => {
    if (!stopArm){ stopArm = true; $("stopBtn").textContent = "Click again to stop"; stopT = setTimeout(() => { stopArm = false; $("stopBtn").textContent = "■ Stop"; }, 3000); return; }
    clearTimeout(stopT); stopArm = false; $("stopBtn").textContent = "Stopping…";
    await cmd("cmd=stop");
  };
  $("vol").oninput = e => { $("volVal").textContent = e.target.value; volDrag = true; if (volT){ clearTimeout(volT); volT = 0; } };
  $("vol").onchange = e => { cmd("cmd=vol&v=" + e.target.value); clearTimeout(volT); volT = setTimeout(() => volDrag = false, 2500); };
  $("maxlen").oninput = e => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); maxlenBusy = true; };
  $("maxlen").onchange = e => { let m = Math.max(1, Math.min(10, parseInt(e.target.value, 10) || 6)); e.target.value = m; cmd("cmd=maxlen&min=" + m); clearTimeout(maxlenT); maxlenT = setTimeout(() => maxlenBusy = false, 2500); };
  $("addBtn").onclick = addReq;
  $("addText").addEventListener("keydown", e => { if (e.key === "Enter" && !e.repeat) addReq(); });
  async function addReq(){
    if (adding) return;
    const t = $("addText").value.trim(); if (!t) return;
    adding = true; $("addBtn").disabled = true; $("addMsg").textContent = "Adding…";
    try {
      const r = await cmd("cmd=add&text=" + encodeURIComponent(t));
      if (r && r.ok){ $("addMsg").textContent = (r.track ? r.track + "  ·  " : "") + (r.status || "done"); $("addText").value = ""; }
      else $("addMsg").textContent = "Couldn't add that one.";
    } finally { adding = false; $("addBtn").disabled = false; }
    clearTimeout(msgT); msgT = setTimeout(() => $("addMsg").textContent = "", 6000);
  }

  function row(item, removable, badge){
    const d = document.createElement("div"); d.className = "row";
    if (badge === "SP" && item.skip) d.style.opacity = .4;   // marked to auto-skip when it plays
    const b = document.createElement("span"); b.className = "badge " + (badge === "YT" ? "yt" : "sp");
    b.textContent = badge === "YT" ? "YT" : "SP"; d.appendChild(b);
    const t = document.createElement("div"); t.className = "t";
    const ti = document.createElement("div"); ti.className = "title"; ti.textContent = item.title; t.appendChild(ti);
    const su = document.createElement("div"); su.className = "sub";
    su.textContent = (item.artist || item.channel || "");
    const tag = document.createElement("span");
    if (badge === "SP" && item.skip){ tag.className = "autotag"; tag.textContent = "will skip"; }
    else if (badge === "YT" || item.requested){ if (item.user){ tag.className = "reqtag"; tag.textContent = "requested by " + item.user; } }
    else { tag.className = "autotag"; tag.textContent = "autoplay"; }   // Spotify's own radio/continuation, not a viewer request
    if (tag.textContent){ su.appendChild(document.createTextNode("  ·  ")); su.appendChild(tag); }
    t.appendChild(su); d.appendChild(t);
    if (item.dur){ const du = document.createElement("span"); du.className = "dur"; du.textContent = fmt(item.dur); d.appendChild(du); }
    if (removable){
      const x = document.createElement("button"); x.className = "x"; x.textContent = "✕";
      if (badge === "YT"){ x.title = "Remove this request"; x.onclick = () => { cmd("cmd=remove&id=" + encodeURIComponent(item.id)); d.style.opacity = .35; }; }
      else { x.title = "Skip this when it comes up (click again to keep it)"; x.onclick = () => { const on = d.style.opacity !== "0.4"; cmd("cmd=skipsong&uri=" + encodeURIComponent(item.uri)); d.style.opacity = on ? "0.4" : "1"; }; }
      d.appendChild(x);
    }
    return d;
  }

  async function poll(){
    try{
      let r = await fetch(API + "/queue?tok=" + TOK + "&t=" + Date.now());
      if (r.status === 403){ await ensureTok(true); r = await fetch(API + "/queue?tok=" + TOK + "&t=" + Date.now()); }   // token rotated (engine restarted) -> re-bootstrap + retry
      if (!r.ok) throw 0;
      const d = await r.json();
      $("offline").style.display = "none"; $("main").style.display = "flex";

      const n = d.now || {};
      playing = !!n.playing;
      if (!ppBusy) $("pp").textContent = playing ? "❚❚" : "▶";
      $("nowTitle").textContent = n.title || "Nothing playing";
      $("nowArtist").textContent = n.artist || "";
      const src = n.source === "youtube" ? "YT" : "SP";
      $("srcBadge").textContent = src === "YT" ? "YOUTUBE" : "SPOTIFY";
      $("srcBadge").className = "badge " + (src === "YT" ? "yt" : "sp");
      if (n.art && n.art !== curArt){ $("art").src = n.art; curArt = n.art; }
      else if (!n.art && curArt){ curArt = ""; $("art").removeAttribute("src"); }   // clear stale art
      prog = n.progress || 0; dur = n.duration || 1; stamp = performance.now();

      const list = $("list"); list.innerHTML = "";
      (d.yt || []).forEach(it => list.appendChild(row(it, true, "YT")));
      (d.spotifyNext || []).forEach(it => list.appendChild(row(it, !!it.uri, "SP")));   // show ALL upcoming autoplay, incl. marked-to-skip (dimmed "will skip")
      const total = (d.yt || []).length + (d.spotifyNext || []).length;
      $("qCount").textContent = total ? total + " queued" : "";
      $("empty").style.display = total ? "none" : "block";

      if (!volDrag){ $("vol").value = d.vol; $("volVal").textContent = d.vol; }
      if (!maxlenBusy && typeof d.maxSec === "number"){ $("maxlen").value = Math.round(d.maxSec / 60); }
      if (typeof d.spConnected === "boolean") spConnected = d.spConnected;
      if (typeof d.spEnabled === "boolean" && !spBusy) spEnabled = d.spEnabled;
      applySp();
      if (typeof d.enabled === "boolean" && !ytBusy){ ytEnabled = d.enabled; applyYt(); }
      if (typeof d.reqEnabled === "boolean" && !allBusy){ allOn = d.reqEnabled; applyAll(); }
      if (typeof d.chatAnnounce === "boolean" && !chatBusy){ chatOn = d.chatAnnounce; applyChat(); }
      $("warn").style.display = d.enabled && !d.playerAlive && (d.yt || []).length ? "block" : "none";
    } catch(_){
      $("offline").style.display = "block"; $("main").style.display = "none";
    }
  }

  function tick(){
    if (!seekDrag){
      let p = playing ? prog + (performance.now() - stamp) : prog;
      if (p > dur) p = dur; if (p < 0) p = 0;
      const pct = dur > 0 ? p / dur * 100 : 0;
      $("bar").style.width = pct + "%"; $("knob").style.left = pct + "%";
    }
    requestAnimationFrame(tick);
  }

  // restore saved section order, then wire collapse (click header) + reorder (drag header)
  function saveOrder(){ try { localStorage.setItem("sqorder", JSON.stringify([...$("main").querySelectorAll(".card[data-sec]")].map(c => c.getAttribute("data-sec")))); } catch(_){} }
  (function restoreOrder(){
    let order; try { order = JSON.parse(localStorage.getItem("sqorder") || "null"); } catch(_){}
    if (!Array.isArray(order)) return;
    order.forEach(sec => { const c = $("main").querySelector('.card[data-sec="' + sec + '"]'); if (c) $("main").appendChild(c); });
  })();
  let dragCard = null;
  document.querySelectorAll(".card[data-sec]").forEach(card => {
    const sec = card.getAttribute("data-sec"), sh = card.querySelector(".sh");
    try { if (localStorage.getItem("sqsec_" + sec) === "1") card.classList.add("collapsed"); } catch(_){}
    if (!sh) return;
    let dragged = false;
    sh.style.cursor = "grab";
    sh.addEventListener("click", () => {
      if (dragged) return;   // a drag just happened - don't also collapse
      card.classList.toggle("collapsed");
      try { localStorage.setItem("sqsec_" + sec, card.classList.contains("collapsed") ? "1" : "0"); } catch(_){}
    });
    sh.setAttribute("draggable", "true");
    sh.addEventListener("dragstart", e => { dragged = true; dragCard = card; try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", sec); } catch(_){} setTimeout(() => card.classList.add("dragging"), 0); });
    sh.addEventListener("dragend", () => { card.classList.remove("dragging"); dragCard = null; saveOrder(); setTimeout(() => dragged = false, 120); });
    card.addEventListener("dragover", e => {
      if (!dragCard || dragCard === card) return;
      e.preventDefault();
      const r = card.getBoundingClientRect();
      $("main").insertBefore(dragCard, (e.clientY - r.top) < r.height / 2 ? card : card.nextSibling);
    });
  });

  (async () => { await ensureTok(); poll(); setInterval(poll, 1500); tick(); })();
</script>
</body>
</html>
